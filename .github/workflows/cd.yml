name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [staging, production]

# Federated credentials, so no cloud secret is stored in GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: nl2sql-assistant

jobs:
  build:
    name: Build and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Registry login
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - id: meta
        name: Work out the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then TAG="${GITHUB_SHA::12}"; fi
          echo "image=${{ secrets.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Add local to ship the Hugging Face model with the image.
          build-args: |
            EXTRAS=

  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          sudo ACCEPT_EULA=Y apt-get update && sudo ACCEPT_EULA=Y apt-get install -y unixodbc-dev
          pip install -e "."

      # Migrations run once here, before the new revision is deployed, rather
      # than on container start where every replica would race the others.
      - name: Upgrade the application database
        env:
          NL2SQL_ENV: production
          NL2SQL_APP_DATABASE_URL: ${{ secrets.NL2SQL_APP_DATABASE_URL }}
          NL2SQL_SECURITY__ALLOWED_SCHEMAS: ${{ vars.NL2SQL_ALLOWED_SCHEMAS }}
        run: alembic upgrade head

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, migrate]
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update the container app
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image ${{ needs.build.outputs.image }} \
            --revision-suffix "$(date +%Y%m%d%H%M%S)"

      - name: Wait for the new revision to be healthy
        run: |
          FQDN=$(az containerapp show \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)

          for attempt in $(seq 1 30); do
            if curl -fsS "https://${FQDN}/api/v1/health" > /dev/null; then
              echo "the deployment is serving"
              curl -fsS "https://${FQDN}/api/v1/ready" || true
              exit 0
            fi
            sleep 10
          done

          echo "the new revision did not become healthy"
          exit 1

      - name: Roll back on failure
        if: failure()
        run: |
          PREVIOUS=$(az containerapp revision list \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --query "[?properties.active].name | [1]" -o tsv)
          if [ -n "$PREVIOUS" ]; then
            az containerapp ingress traffic set \
              --name ${{ vars.CONTAINER_APP_NAME }} \
              --resource-group ${{ vars.RESOURCE_GROUP }} \
              --revision-weight "${PREVIOUS}=100"
          fi
