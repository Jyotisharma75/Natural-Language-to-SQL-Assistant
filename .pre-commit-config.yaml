# Run the cheap checks before a commit, so CI is not the first place a
# formatting mistake is found.
#
#   pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: house-style
        name: No em dashes or smart quotes
        entry: python scripts/check_style.py
        language: system
        pass_filenames: true

      - id: mypy
        name: Type check
        entry: python -m mypy src/nl2sql
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-fast
        name: Unit, security and validation tests
        entry: python -m pytest tests/unit tests/security tests/sql_validation -q
        language: system
        types: [python]
        pass_filenames: false
